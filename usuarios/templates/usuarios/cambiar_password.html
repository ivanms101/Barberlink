{% extends "base.html" %}
{% load static %}

{% block titulo %}
    Barberlink - Cambiar contraseña
{% endblock %}

{% block css %}
    <link rel="stylesheet" href="{% static 'css/cambiar_password.css' %}">
{% endblock %}

{% block contenido %}
    <h1>Cambiar contraseña</h1>
    <form id="form-cambiar-password" data-id="{{ pk }}">
        <label for="password">Nueva contraseña:</label>
        <input type="password" id="password" name="password">

        <label for="confirmar_password">Confirmar contraseña:</label>
        <input type="password" id="confirmar_password" name="confirmar_password">

        <button type="submit">Cambiar contraseña</button>
    </form>
    <a class="volver" href="{% url 'usuarios' %}">Volver</a>
{% endblock %}

{% block js %}
    <script src="{% static 'js/cambiar_password.js' %}"></script>
{% endblock %}

{% load static %}

<!doctype html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Barberlink - Registro</title>

    <link
        rel="stylesheet"
        href="{% static 'css/registro.css' %}"
    >

</head>

<body>

    <div class="contenedor-registro">

        <h1>Crear cuenta</h1>

        <form id="form-registro">

            {% csrf_token %}


            <label for="nombre">
                Nombre:
            </label>

            <input
                type="text"
                id="nombre"
                name="nombre"
            >


            <label for="tipo_documento">
                Tipo de documento:
            </label>

            <select
                id="tipo_documento"
                name="tipo_documento"
            >
                <option value="CC">CC</option>
                <option value="TI">TI</option>
                <option value="CE">CE</option>
            </select>


            <label for="documento">
                Documento:
            </label>

            <input
                type="text"
                id="documento"
                name="documento"
            >


            <label for="telefono">
                Teléfono:
            </label>

            <input
                type="text"
                id="telefono"
                name="telefono"
            >


            <label for="correo">
                Correo:
            </label>

            <input
                type="email"
                id="correo"
                name="correo"
            >


            <label for="password">
                Contraseña:
            </label>

            <input
                type="password"
                id="password"
                name="password"
            >


            <label for="confirmar-password">
                Confirmar contraseña:
            </label>

            <input
                type="password"
                id="confirmar-password"
                name="confirmar-password"
            >


            <p id="mensaje-error"></p>


            <button type="submit">
                Registrarme
            </button>

        </form>


        <a href="{% url 'login' %}">
            Ya tengo cuenta
        </a>

    </div>


    <script src="{% static 'js/registro.js' %}"></script>

</body>

</html>

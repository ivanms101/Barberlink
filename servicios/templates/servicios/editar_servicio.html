{% extends "base.html" %}
{% load static %}
{% block titulo %}
    Barberlink - Editar servicio
{% endblock %}
{% block css %}
    <link rel="stylesheet" href="{% static 'css/editar_servicio.css' %}">
{% endblock %}
{% block contenido %}
    <h1>Editar servicios</h1>
    <form id="form-editar-servicio" data-id="{{ pk }}">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre">

        <label for="tarifa">Tarifa</label>
        <input type="number" id="tarifa" name="tarifa" step="0.01">

        <label for="duracion">Duración (minutos):</label>
        <input type="number" id="duracion" name="duracion" min="15" step="15">

        <p id="mensaje-error"></p>

        <button type="submit">Guardar</button>
    </form>
    <a class="volver" href="{% url 'servicios' %}">Volver</a>
{% endblock %}
{% block js %}
    <script src="{% static 'js/editar_servicio.js' %}"></script>
{% endblock %}

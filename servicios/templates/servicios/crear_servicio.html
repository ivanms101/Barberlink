{% extends "base.html" %}
{% load static %}
{% block titulo %}
    Barberlink - Crear servicio
{% endblock %}
{% block css %}
    <link rel="stylesheet" href="{% static 'css/crear_servicio.css' %}">
{% endblock %}
{% block contenido %}
    <h1>Crear servicios</h1>
    <form id="form-crear-servicio">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre">

        <label for="tarifa">Tarifa</label>
        <input type="number" id="tarifa" name="tarifa" step="0.01">

        <p id="mensaje-error"></p>

        <button type="submit">Crear servicio</button>
    </form>
    <a class="volver" href="{% url 'servicios' %}">Volver</a>
{% endblock %}
{% block js %}
    <script src="{% static 'js/crear_servicio.js' %}"></script>
{% endblock %}
